[workspace]
resolver = "2"
members = [
    "crates/atlas-core",
    "crates/atlas-db",
    "crates/atlas-platform",
    "crates/atlas-search",
    "crates/atlas-recommender",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Ahmed Irfan <ahmedirfancodes@gmail.com>"]
license = "MIT"
repository = "https://github.com/AhmedIrfan7/file-atlas"
homepage = "https://github.com/AhmedIrfan7/file-atlas"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
# `cargo` lints stay off until we start publishing to crates.io.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "backup", "chrono", "serde_json"] }
walkdir = "2"
ignore = "0.4"
blake3 = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dashmap = "6"
crossbeam-channel = "0.5"
tempfile = "3"
pretty_assertions = "1"
insta = { version = "1", features = ["yaml"] }
proptest = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
