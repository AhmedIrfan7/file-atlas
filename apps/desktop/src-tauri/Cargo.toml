[package]
name = "atlas-desktop"
version = "0.1.0"
description = "File Atlas desktop shell (Tauri v2)"
authors = ["Ahmed Irfan <ahmedirfancodes@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/AhmedIrfan7/file-atlas"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
