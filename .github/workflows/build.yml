name: Build

# Validates that the Tauri bundle still builds on every push and PR. Does
# not publish anything: `release.yml`, triggered only by a `v*` tag push, is
# the workflow that actually signs artifacts and creates a GitHub Release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter atlas-desktop build

      # createUpdaterArtifacts in tauri.conf.json means a plain `tauri build`
      # demands the signing key, which only release.yml (tag pushes) has.
      # This is a compile/bundle check, not a publish, so skip updater
      # artifact signing here entirely rather than handing this workflow
      # a copy of the signing key it has no reason to hold.
      - name: Build Tauri bundle
        run: pnpm --filter atlas-desktop tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-atlas-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
