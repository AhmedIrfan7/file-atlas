[package]
name = "atlas-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "File Atlas desktop shell (Tauri v2)"

[lints]
workspace = true

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
rusqlite = { workspace = true }
time = { workspace = true }
atlas-core = { path = "../../../crates/atlas-core" }
atlas-db = { path = "../../../crates/atlas-db" }
atlas-platform = { path = "../../../crates/atlas-platform" }
atlas-search = { path = "../../../crates/atlas-search" }
atlas-recommender = { path = "../../../crates/atlas-recommender" }
atlas-ai = { path = "../../../crates/atlas-ai" }
